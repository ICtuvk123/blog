<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小游戏 · Thoughts</title>
  <meta name="description" content="负责记录想法的个人空间。">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="wave-scene" aria-hidden="true">
    <svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none">
      <path class="wave-path wave-one" d="M0,96 C160,28 300,28 480,96 C650,160 820,160 1000,96 C1160,34 1300,34 1440,96 L1440,220 L0,220 Z"></path>
      <path class="wave-path wave-two" d="M0,128 C180,78 330,78 520,128 C690,176 860,176 1040,128 C1200,84 1320,84 1440,128 L1440,220 L0,220 Z"></path>
      <path class="wave-path wave-three" d="M0,158 C170,118 340,118 520,158 C700,198 880,198 1060,158 C1220,122 1340,122 1440,158 L1440,220 L0,220 Z"></path>
    </svg>
  </div>
  <header class="site-header">
    <a class="brand" href=".">Thoughts</a>
    
    <nav class="nav">
      <a href=".">首页</a>
      <a href="archive.html">归档</a>
      <a href="game.html">游戏</a>
      <a href="about.html">关于</a>
    </nav>

  </header>
  <main class="container">
    
<section class="game-shell">
  <div class="game-board" id="gameBoard" aria-label="点星星小游戏">
    <button class="target-star hidden" id="targetStar" type="button" aria-label="点我得分">✦</button>
    <div class="game-message" id="gameMessage">
      <div>
        <h1>点星星</h1>
        <p>30 秒内尽量点击出现的星星。星星会换位置，点中一次加 1 分。</p>
        <button class="button" id="startGame" type="button">开始游戏</button>
      </div>
    </div>
  </div>
  <aside class="panel game-hud">
    <div>
      <div class="eyebrow">Tiny Game</div>
      <h1>点星星</h1>
      <p class="note">规则很简单：看到星星就点。没有方向键，没有复杂操作。</p>
    </div>
    <div class="stat-grid">
      <div class="stat"><strong id="score">0</strong><span>得分</span></div>
      <div class="stat"><strong id="timeLeft">30</strong><span>剩余秒数</span></div>
    </div>
    <div class="game-controls">
      <button class="button" id="restartGame" type="button">重新开始</button>
      <a class="button secondary" href=".">回首页</a>
    </div>
    <p class="note">目标：30 秒内超过 20 分。</p>
  </aside>
</section>
<script>
(() => {
  const board = document.getElementById("gameBoard");
  const star = document.getElementById("targetStar");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("timeLeft");
  const message = document.getElementById("gameMessage");
  const start = document.getElementById("startGame");
  const restart = document.getElementById("restartGame");

  let score = 0;
  let timeLeft = 30;
  let running = false;
  let timer = null;

  function updateHud() {
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
  }

  function moveStar() {
    const boardRect = board.getBoundingClientRect();
    const padding = 58;
    const x = padding + Math.random() * Math.max(1, boardRect.width - padding * 2);
    const y = padding + Math.random() * Math.max(1, boardRect.height - padding * 2);
    star.style.left = `${x}px`;
    star.style.top = `${y}px`;
  }

  function showPop(x, y) {
    const pop = document.createElement("div");
    pop.className = "pop-text";
    pop.textContent = "+1";
    pop.style.left = `${x}px`;
    pop.style.top = `${y}px`;
    board.appendChild(pop);
    window.setTimeout(() => pop.remove(), 600);
  }

  function endGame() {
    running = false;
    window.clearInterval(timer);
    star.classList.add("hidden");
    message.classList.remove("hidden");
    message.querySelector("h1").textContent = "时间到";
    message.querySelector("p").textContent = `最终得分：${score}。${score >= 20 ? "不错。" : "再来一局会更高。"}`;
    start.textContent = "再来一局";
  }

  function begin() {
    score = 0;
    timeLeft = 30;
    running = true;
    updateHud();
    message.classList.add("hidden");
    star.classList.remove("hidden");
    moveStar();
    window.clearInterval(timer);
    timer = window.setInterval(() => {
      timeLeft -= 1;
      updateHud();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  star.addEventListener("click", () => {
    if (!running) return;
    score += 1;
    updateHud();
    const rect = star.getBoundingClientRect();
    const boardRect = board.getBoundingClientRect();
    showPop(rect.left - boardRect.left + rect.width / 2, rect.top - boardRect.top);
    moveStar();
  });

  start.addEventListener("click", begin);
  restart.addEventListener("click", begin);
  updateHud();
})();
</script>

  </main>
</body>
</html>
