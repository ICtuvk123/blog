<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小游戏 · Thoughts</title>
  <meta name="description" content="负责记录想法的个人空间。">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="wave-scene" aria-hidden="true">
    <svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none">
      <path class="wave-path wave-one" d="M0,96 C160,28 300,28 480,96 C650,160 820,160 1000,96 C1160,34 1300,34 1440,96 L1440,220 L0,220 Z"></path>
      <path class="wave-path wave-two" d="M0,128 C180,78 330,78 520,128 C690,176 860,176 1040,128 C1200,84 1320,84 1440,128 L1440,220 L0,220 Z"></path>
      <path class="wave-path wave-three" d="M0,158 C170,118 340,118 520,158 C700,198 880,198 1060,158 C1220,122 1340,122 1440,158 L1440,220 L0,220 Z"></path>
    </svg>
  </div>
  <header class="site-header">
    <a class="brand" href=".">Thoughts</a>
    
    <nav class="nav">
      <a href=".">首页</a>
      <a href="archive.html">归档</a>
      <a href="game.html">游戏</a>
      <a href="about.html">关于</a>
    </nav>

  </header>
  <main class="container">
    
<section class="game-shell">
  <div class="game-board" id="gameBoard" tabindex="0" aria-label="接住落星小游戏">
    <div class="catcher" id="catcher"></div>
    <div class="game-message" id="gameMessage">
      <div>
        <h1>接住落星</h1>
        <p>用方向键、A/D 或鼠标移动托盘。接住星星得分，漏掉 5 个结束。</p>
        <button class="button" id="startGame" type="button">开始游戏</button>
      </div>
    </div>
  </div>
  <aside class="panel game-hud">
    <div>
      <div class="eyebrow">Tiny Game</div>
      <h1>接住落星</h1>
      <p class="note">一个放在博客里的轻量小游戏。适合短暂休息，不依赖任何外部库。</p>
    </div>
    <div class="stat-grid">
      <div class="stat"><strong id="score">0</strong><span>得分</span></div>
      <div class="stat"><strong id="missed">0</strong><span>漏掉</span></div>
    </div>
    <div class="game-controls">
      <button class="button" id="restartGame" type="button">重新开始</button>
      <a class="button secondary" href=".">回首页</a>
    </div>
    <p class="note">提示：连续接住会逐步加速。</p>
  </aside>
</section>
<script>
(() => {
  const board = document.getElementById("gameBoard");
  const catcher = document.getElementById("catcher");
  const scoreEl = document.getElementById("score");
  const missedEl = document.getElementById("missed");
  const message = document.getElementById("gameMessage");
  const start = document.getElementById("startGame");
  const restart = document.getElementById("restartGame");

  let score = 0;
  let missed = 0;
  let running = false;
  let catcherX = 0.5;
  let stars = [];
  let lastTime = 0;
  let spawnTimer = 0;

  function reset() {
    score = 0;
    missed = 0;
    stars.forEach((star) => star.el.remove());
    stars = [];
    spawnTimer = 0;
    catcherX = 0.5;
    updateHud();
    updateCatcher();
  }

  function updateHud() {
    scoreEl.textContent = score;
    missedEl.textContent = missed;
  }

  function updateCatcher() {
    catcher.style.left = `${catcherX * 100}%`;
  }

  function spawnStar() {
    const el = document.createElement("div");
    el.className = "star";
    el.textContent = "✦";
    board.appendChild(el);
    stars.push({
      el,
      x: Math.random() * 0.92 + 0.04,
      y: -0.08,
      speed: 0.18 + Math.min(score, 40) * 0.004 + Math.random() * 0.08,
    });
  }

  function gameOver() {
    running = false;
    message.classList.remove("hidden");
    message.querySelector("h1").textContent = "游戏结束";
    message.querySelector("p").textContent = `最终得分：${score}。点击按钮再来一局。`;
    start.textContent = "再来一局";
  }

  function tick(time) {
    if (!running) return;
    const delta = Math.min((time - lastTime) / 1000, 0.04);
    lastTime = time;
    spawnTimer -= delta;
    if (spawnTimer <= 0) {
      spawnStar();
      spawnTimer = Math.max(0.35, 0.9 - score * 0.015);
    }

    const boardRect = board.getBoundingClientRect();
    const catcherRect = catcher.getBoundingClientRect();
    const nextStars = [];

    for (const star of stars) {
      star.y += star.speed * delta;
      star.el.style.left = `${star.x * 100}%`;
      star.el.style.top = `${star.y * 100}%`;
      const starRect = star.el.getBoundingClientRect();
      const caught =
        starRect.bottom >= catcherRect.top &&
        starRect.top <= catcherRect.bottom &&
        starRect.right >= catcherRect.left &&
        starRect.left <= catcherRect.right;

      if (caught) {
        score += 1;
        star.el.remove();
        updateHud();
      } else if (starRect.top > boardRect.bottom) {
        missed += 1;
        star.el.remove();
        updateHud();
      } else {
        nextStars.push(star);
      }
    }

    stars = nextStars;
    if (missed >= 5) {
      gameOver();
      return;
    }
    requestAnimationFrame(tick);
  }

  function begin() {
    reset();
    running = true;
    message.classList.add("hidden");
    board.focus();
    lastTime = performance.now();
    requestAnimationFrame(tick);
  }

  board.addEventListener("mousemove", (event) => {
    const rect = board.getBoundingClientRect();
    catcherX = Math.min(0.96, Math.max(0.04, (event.clientX - rect.left) / rect.width));
    updateCatcher();
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
      catcherX = Math.max(0.04, catcherX - 0.06);
      updateCatcher();
    }
    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
      catcherX = Math.min(0.96, catcherX + 0.06);
      updateCatcher();
    }
    if (event.key === " " && !running) begin();
  });

  start.addEventListener("click", begin);
  restart.addEventListener("click", begin);
  updateCatcher();
})();
</script>

  </main>
</body>
</html>
