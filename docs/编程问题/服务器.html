  <h2 id="系统盘存满了">系统盘存满了</h2>
<pre><code>du -h --max-depth=1 | sort -hr</code></pre>
<p>可以察看哪些文件占用内存最高</p>
<pre><code>mv /root/scMRDR /root/autodl-tmp/</code></pre>
<p>直接把最占用内存的文件移动进入数据盘就好了</p>
<pre><code>df . -h</code></pre>
<p>查看还剩多少内存</p>
<pre><code>tar -xzf file.tgz file</code></pre>
<p>解压缩</p>
<pre><code>tar -czf file.tgz file</code></pre>
<p>压缩</p>
